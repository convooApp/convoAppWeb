<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Convoo Dating App</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License — https://github.com/rafgraph/spa-github-pages
    // GitHub Pages has no server-side routing, so a direct hit on a clean
    // path (e.g. /meter) lands here. We encode the path + query into a single
    // query string and redirect to the site root; the companion snippet in
    // index.html decodes it and restores the clean URL before React mounts.
    var pathSegmentsToKeep = 0;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
