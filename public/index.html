<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convoo Dating App - Find Meaningful Connections Through Great Conversations</title>
    <meta name="description" content="Convoo is a next-generation dating app that matches people based on conversation chemistry. Discover meaningful connections through quality conversations." />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "url": "https://convoo.app",
      "name": "Convoo",
      "logo": "https://convoo.app/logo.png",
      "contactPoint": [{
        "@type": "ContactPoint",
        "email": "support@convoo.app",
        "contactType": "customer support"
      }]
    }
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
