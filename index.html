    <!-- SPA routing for GitHub Pages (must run before the app mounts) -->
    <script type="text/javascript">
      // 1) Decode the "?/path" redirect produced by 404.html
      //    (rafgraph/spa-github-pages, MIT) so a direct hit or refresh on a
      //    clean URL like /meter restores that URL instead of bouncing.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);

      // 2) Migrate legacy HashRouter links (e.g. /#/meter) to clean paths now
      //    that the app uses BrowserRouter. Only "#/" hashes are old router
      //    paths; in-page anchors such as "#faq" are deliberately left alone.
      (function (l) {
        if (l.hash.indexOf('#/') === 0) {
          window.history.replaceState(null, null, l.hash.slice(1));
        }
      })(window.location);
    </script>
